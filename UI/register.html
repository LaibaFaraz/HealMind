<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealMind | Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="MainContainer">
        <div class="auth-container">
            <div class="GlassPanel auth-box">
                <h1 class="MainTitle TextGradient">HEALMIND</h1>
                <p class="SubTitleText auth-subtitle">Create your account</p>

                <div id="error-message" class="error-box hidden"></div>

                <form id="register-form" class="auth-form">
                    <div class="input-group">
                        <label class="input-label">Email</label>
                        <input type="email" id="email" class="auth-input" placeholder="you@example.com" required>
                    </div>

                    <div class="input-group">
                        <label class="input-label">Password</label>
                        <input type="password" id="password" class="auth-input" placeholder="••••••••" required>
                    </div>

                    <div class="input-group">
                        <label class="input-label">Confirm Password</label>
                        <input type="password" id="confirm-password" class="auth-input" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="auth-btn" id="register-btn">
                        Create Account
                    </button>
                </form>

                <p class="auth-switch">
                    Already have an account? <a href="{{ url_for('login') }}" class="auth-link">Sign In</a>
                </p>
            </div>
        </div>
    </div>
    <script type="module" src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
